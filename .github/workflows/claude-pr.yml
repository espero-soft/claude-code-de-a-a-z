# Claude traite une pull request quand on lui pose l'étiquette « claude » :
# il lit la description de la PR, fait ce qui y est demandé sur la branche
# de la PR, lance npm test, commite et commente la PR. Claude ne pousse pas :
# .claude/settings.json demande une confirmation pour « git push », que personne
# ne peut donner ici. C'est l'étape suivante du workflow qui relance les tests
# et pousse (sans --force), avec le jeton éphémère du job.
name: Claude sur PR étiquetée

on:
  pull_request:
    types: [labeled]

# Aucun droit par défaut ; le job ne reçoit que ce dont il a besoin.
permissions: {}

# Une seule exécution à la fois par PR (une seconde étiquette attend la première).
concurrency:
  group: claude-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    outputs:
      pousse: ${{ steps.push.outputs.pousse }}
    # Seulement l'étiquette « claude », et seulement pour une branche de ce dépôt
    # (pas de fork : on ne pourrait pas y pousser, et les secrets n'y sont pas transmis).
    # Jamais sur main : une PR dont la branche SOURCE est main (de main vers une autre
    # branche) ferait pousser le job sur main. L'étape de push le revérifie, et le
    # ruleset de main refuse de toute façon le push direct (GITHUB_TOKEN compris).
    if: >-
      github.event.label.name == 'claude' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main' &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # modifier les fichiers et pousser le commit
      pull-requests: write   # lire la PR et la commenter
    env:
      # Lu par prisma.config.ts lors de « prisma generate » (postinstall).
      DATABASE_URL: file:./dev.db
    steps:
      - name: Récupérer la branche de la PR
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Le nom de la branche (pas le SHA) : sinon HEAD est détaché et on ne peut pas pousser.
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          # L'action Claude installe ses propres identifiants git.
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer Claude
        id: claude
        uses: anthropics/claude-code-action@3b7e1a45ca6f231c62605aabcf79e6a41b08c7da # v1.0.263
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Jeton éphémère du workflow, limité aux permissions du job ci-dessus.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Dépôt : ${{ github.repository }}
            Pull request : #${{ github.event.pull_request.number }}
            Branche (déjà extraite) : ${{ github.event.pull_request.head.ref }}

            1. Lis la description de la PR avec `gh pr view ${{ github.event.pull_request.number }}`.
               Elle contient la demande à réaliser.
            2. Réalise cette demande sur la branche actuelle, en respectant CLAUDE.md
               (code et textes en français, règles métier R1 à R6, montants en centimes).
            3. Lance `npm test`. Si des tests échouent, corrige-les ; s'ils échouent encore,
               ne pousse rien.
            4. Si les tests passent : `git add` des fichiers modifiés et un commit au message
               en français, sur la branche actuelle. Ne pousse pas et ne change pas de branche :
               une étape suivante du workflow relance les tests et pousse tes commits.
            5. Termine toujours par un commentaire sur la PR (`gh pr comment`) qui résume
               les changements et le résultat de `npm test`. N'y signale pas l'absence de push
               comme un blocage : le workflow publie ensuite son propre commentaire sur le push.
          claude_args: |
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(npm test),Bash(npx vitest:*),Bash(git status),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
            --disallowedTools "Bash(git push:*)"
            --max-turns 40

      # Le push est fait ici, par le workflow, et non par Claude : la règle « ask »
      # du projet sur git push reste intacte. On ne croit pas Claude sur parole :
      # on vérifie la branche, on relance les tests, puis on pousse sans --force
      # (un push refusé parce que la branche a avancé entre-temps fait échouer le job).
      - name: Pousser les commits de Claude
        id: push
        env:
          # Passés par l'environnement, jamais interpolés dans le script (injection).
          BRANCHE: ${{ github.event.pull_request.head.ref }}
          BRANCHE_PAR_DEFAUT: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$BRANCHE" = "main" ] || [ "$BRANCHE" = "$BRANCHE_PAR_DEFAUT" ]; then
            echo "::error::Le workflow ne pousse jamais sur $BRANCHE ; rien n'est poussé."
            exit 1
          fi
          if [ "$(git rev-parse --abbrev-ref HEAD)" != "$BRANCHE" ]; then
            echo "::error::HEAD n'est plus sur la branche $BRANCHE ; rien n'est poussé."
            exit 1
          fi
          git fetch --quiet "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${BRANCHE}"
          NOUVEAUX=$(git rev-list --count FETCH_HEAD..HEAD)
          echo "nouveaux=$NOUVEAUX" >> "$GITHUB_OUTPUT"
          if [ "$NOUVEAUX" -eq 0 ]; then
            echo "Aucun commit de Claude à pousser."
            exit 0
          fi
          git log --oneline FETCH_HEAD..HEAD
          npm test
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCHE}"
          echo "pousse=oui" >> "$GITHUB_OUTPUT"

      - name: Commenter le résultat du push
        if: always() && steps.claude.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          BRANCHE: ${{ github.event.pull_request.head.ref }}
          RESULTAT: ${{ steps.push.outcome }}
          NOUVEAUX: ${{ steps.push.outputs.nouveaux }}
        run: |
          if [ "$RESULTAT" != "success" ]; then
            MESSAGE="Push par le workflow : **échec** (voir le journal de l'exécution). Rien n'a été poussé sur \`$BRANCHE\`."
          elif [ "${NOUVEAUX:-0}" -eq 0 ]; then
            MESSAGE="Push par le workflow : aucun nouveau commit à pousser."
          else
            MESSAGE="Push par le workflow : $NOUVEAUX commit(s) poussé(s) sur \`$BRANCHE\` après une nouvelle passe de \`npm test\`."
          fi
          gh pr comment "$PR" --body "$MESSAGE"

  # Un push fait avec le GITHUB_TOKEN ne déclenche pas « pull_request » : sans cette
  # relance, le contrôle obligatoire « Lint et tests » manquerait sur le nouveau commit
  # et la PR resterait bloquée. Job séparé : le droit « actions: write » ne sert qu'à
  # cette relance et n'est jamais donné au job où Claude travaille.
  relancer-verifications:
    needs: claude
    if: needs.claude.outputs.pousse == 'oui'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write   # lancer verifications.yml, rien d'autre
    steps:
      - name: Relancer « Lint et tests » sur la branche de la PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCHE: ${{ github.event.pull_request.head.ref }}
        run: gh workflow run verifications.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCHE"
